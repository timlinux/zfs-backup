name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The integration-tagged files never run in CI (they need root and a real
      # ZFS pool), but they must always compile.
      - name: Vet integration tests
        run: go vet -tags integration ./...

      - name: Check formatting
        run: |
          # report.go and restore.go still predate a gofmt pass. Every other
          # source is formatted and stays that way; shrink this exclusion list,
          # never grow it.
          FILES=$(ls *.go | grep -vE '^(report|restore)\.go$')
          UNFORMATTED=$(gofmt -l $FILES)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::These files need gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Test
        run: go test -v ./...
